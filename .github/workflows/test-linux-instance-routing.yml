name: Linux dual Zotero routing

'on':
  push:
    branches:
      - docs/linux-dual-zotero-routing
  pull_request:
    branches:
      - feature/script-trigger-collection-target
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-linux-routing:
    name: Test Linux instance routing
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm install

      - name: Run extension routing tests
        id: node_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test script-trigger-tests/*.test.js 2>&1 | tee node-test-output.txt

      - name: Run Native Host routing tests
        id: python_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover native-host/tests -v 2>&1 | tee python-test-output.txt

      - name: Upload routing diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-dual-zotero-test-diagnostics
          path: |
            node-test-output.txt
            python-test-output.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce test results
        if: steps.node_tests.outcome != 'success' || steps.python_tests.outcome != 'success'
        run: exit 1
