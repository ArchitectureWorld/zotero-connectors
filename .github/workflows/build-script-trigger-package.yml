name: Build script-trigger test package

'on':
  push:
    branches:
      - feature/script-trigger
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run automated tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm install

      - name: Run script-trigger tests
        run: npm run test:script-trigger

  build-extension:
    name: Build Chrome extension
    needs: test
    runs-on: ubuntu-latest
    env:
      CHROME_EXTENSION_KEY: 
      EXPECTED_EXTENSION_ID: anakemdifclhajhpbjlgfpeokaphddam
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Linux build tools
        run: sudo apt-get update && sudo apt-get install -y jq rsync

      - name: Install Node dependencies
        run: npm install

      - name: Build Manifest V3 extension
        run: ./build.sh -p b -d

      - name: Verify extension package
        run: |
          test -f build/manifestv3/manifest.json
          test -f build/manifestv3/scriptTrigger.js
          jq -e '.permissions | index("nativeMessaging")' build/manifestv3/manifest.json
          jq -e --arg key "$CHROME_EXTENSION_KEY" '.key == $key' build/manifestv3/manifest.json
          python - <<'PY'
          import base64, hashlib, json, os
          manifest = json.load(open('build/manifestv3/manifest.json', encoding='utf-8'))
          public_key = base64.b64decode(manifest['key'])
          digest = hashlib.sha256(public_key).digest()[:16]
          alphabet = 'abcdefghijklmnop'
          extension_id = ''.join(alphabet[b >> 4] + alphabet[b & 15] for b in digest)
          assert extension_id == os.environ['EXPECTED_EXTENSION_ID'], (extension_id, os.environ['EXPECTED_EXTENSION_ID'])
          print(f'Extension ID: {extension_id}')
          PY

      - name: Upload built extension
        uses: actions/upload-artifact@v4
        with:
          name: built-extension
          path: build/manifestv3
          if-no-files-found: error
          retention-days: 14

  package-windows:
    name: Build beginner Windows package
    needs: build-extension
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.11.1

      - name: Build native host executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --name zotero_script_trigger_host `
            --paths native-host `
            native-host/zotero_script_trigger_host.py

      - name: Build command-line executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --name zotero_script_trigger_cli `
            --paths native-host `
            native-host/zotero_script_trigger_cli.py

      - name: Download built extension
        uses: actions/download-artifact@v4
        with:
          name: built-extension
          path: package/浏览器插件

      - name: Assemble beginner package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/app | Out-Null
          New-Item -ItemType Directory -Force package/安装工具 | Out-Null
          Copy-Item dist/zotero_script_trigger_host.exe package/app/
          Copy-Item dist/zotero_script_trigger_cli.exe package/app/
          Copy-Item packaging/install-packaged.ps1 package/安装工具/install.ps1
          Copy-Item packaging/uninstall-packaged.ps1 package/安装工具/uninstall.ps1
          Copy-Item packaging/open-extension-page.ps1 package/安装工具/open-extension-page.ps1
          Copy-Item packaging/test-connection.ps1 package/安装工具/test-connection.ps1
          Copy-Item packaging/save-current.ps1 package/安装工具/save-current.ps1
          Copy-Item 'packaging/1-安装本地助手.bat' package/
          Copy-Item 'packaging/2-加载浏览器插件.bat' package/
          Copy-Item 'packaging/3-测试连接.bat' package/
          Copy-Item 'packaging/4-保存当前网页.bat' package/
          Copy-Item 'packaging/5-卸载.bat' package/
          Copy-Item 'packaging/使用说明.txt' package/
          Compress-Archive -Path package/* -DestinationPath Zotero-Script-Trigger-Test-Package.zip -Force

      - name: Verify package contents
        shell: pwsh
        run: |
          $required = @(
            'package/浏览器插件/manifest.json',
            'package/浏览器插件/scriptTrigger.js',
            'package/app/zotero_script_trigger_host.exe',
            'package/app/zotero_script_trigger_cli.exe',
            'package/1-安装本地助手.bat',
            'package/2-加载浏览器插件.bat',
            'package/3-测试连接.bat',
            'package/4-保存当前网页.bat',
            'package/5-卸载.bat',
            'package/使用说明.txt',
            'Zotero-Script-Trigger-Test-Package.zip'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing package file: $path" }
          }

      - name: Upload beginner test package
        uses: actions/upload-artifact@v4
        with:
          name: Zotero-Script-Trigger-Test-Package
          path: Zotero-Script-Trigger-Test-Package.zip
          if-no-files-found: error
          retention-days: 14
